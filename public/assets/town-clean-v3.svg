<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="2040" viewBox="0 0 1170 2040">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#081812"/>
    <stop offset=".16" stop-color="#12271f"/>
    <stop offset=".42" stop-color="#274039"/>
    <stop offset="1" stop-color="#425749"/>
  </linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7f8276"/>
    <stop offset=".48" stop-color="#555b53"/>
    <stop offset="1" stop-color="#333b37"/>
  </linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#203e39"/>
    <stop offset="1" stop-color="#102924"/>
  </linearGradient>
  <linearGradient id="roofBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#294a50"/>
    <stop offset="1" stop-color="#17343a"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#315f66"/>
    <stop offset=".5" stop-color="#214b52"/>
    <stop offset="1" stop-color="#15343a"/>
  </linearGradient>
  <radialGradient id="lamp">
    <stop offset="0" stop-color="#ffd784" stop-opacity=".95"/>
    <stop offset=".35" stop-color="#d49d4c" stop-opacity=".45"/>
    <stop offset="1" stop-color="#d49d4c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="forgeGlow">
    <stop offset="0" stop-color="#ffad55" stop-opacity=".85"/>
    <stop offset=".5" stop-color="#bb6738" stop-opacity=".35"/>
    <stop offset="1" stop-color="#6f3b28" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="smoke"><feGaussianBlur stdDeviation="16"/></filter>
  <pattern id="cobble" width="54" height="36" patternUnits="userSpaceOnUse">
    <path d="M2 18 Q14 4 28 13 T52 18 M-8 36 Q7 22 21 30 T45 35" fill="none" stroke="#909282" stroke-opacity=".22" stroke-width="3"/>
  </pattern>
</defs>

